<!-- 이메일 전송 템플릿 -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>    
        <div style="font-family: Arial; max-width: 600px; margin: 0 auto;">
            <h2 style="color: #333;" th:text="${title}">🔐 Miruni 인증 코드</h2>
            <p th:text="${description}">인증을 위한 코드입니다.</p>
            <div style="background: #f5f5f5; padding: 20px; text-align: center; margin: 20px 0;">
                <h1 style="color: #007bff; font-size: 32px; margin: 0;" th:text="${code}">123456</h1>
            </div>
            <p><strong>주의:</strong> 이 코드는 5분 후 만료됩니다.</p>
            <p>본인이 요청하지 않은 경우 이 이메일을 무시하세요.</p>
        </div>
    </body>
</html>
