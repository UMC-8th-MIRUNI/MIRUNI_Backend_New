spring:
  config:
      import:
        - classpath:mail-config.yml

  datasource:
    url: jdbc:mysql://localhost:3306/miruni
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 500
    hibernate:
      ddl-auto: create

  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

fcm:
  key:
#    path: firebase/miruni-9718b-firebase-adminsdk-fbsvc-a07f2f7db8.json
    path: src/main/resources/firebase/miruni-9718b-firebase-adminsdk-fbsvc-a07f2f7db8.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  temp-token-expiration: 300000

miruni:
  email:
    verification:
      prefix: "email_verification:"
      expire-minutes: 5
      from-address: "miruniumc@gmail.com"
      from-name: "Miruni"
      subject: "🔐 Miruni 회원가입 인증 코드"
